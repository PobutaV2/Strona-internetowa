<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<title>Moja Strona</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: rgb(45, 45, 45);
        color: white;
        padding: 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h1 {
        margin-bottom: 40px;
        text-align: center;
        font-size: 2.5rem;
        border-bottom: 3px solid black;
        padding-bottom: 10px;
        width: 100%;
        max-width: 600px;
    }

    .zadanie {
        background-color: rgb(65, 65, 65);
        border: 2px solid black;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
        width: 100%;
        max-width: 600px;
    }

    .zadanie h2 {
        font-size: 1.4rem;
        margin-bottom: 25px;
        text-align: center;
        color: #ffcc00;
    }

    .wiersz {
        display: flex;
        gap: 25px;
    }

    .kolumna {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .kolumna h3 {
        font-size: 1.2rem;
        border-bottom: 2px solid rgb(100, 100, 100);
        padding-bottom: 5px;
        margin-bottom: 5px;
        color: #aaa;
    }

    a {
        color: #4da6ff;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.2s;
    }

    a:hover {
        color: #99ccff;
        text-decoration: underline;
    }
</style>
</head>
<body>

    <h1>Strona Jakuba Pobuty</h1>

    <div class="zadanie">
        <h2>Zadania Początkowe</h2>
        
        <div class="wiersz">
            <div class="kolumna">
                <h3>Wersje Moje</h3>
                <a href="zadanie1.html">Zadanie z tabelkami</a>
                <a href="zadanie2.html">Zadanie z formularzem</a>
            </div>
            <div class="kolumna">
                <h3>Wersje AI</h3>
                <a href="zadanie1_ai.html">Zadanie z tabelkami</a>
                <a href="zadanie2_ai.html">Zadanie z formularzem</a>
            </div>
        </div>
    </div>

    <div class="zadanie">
        <h2>Zadania 3.x</h2>
        
        <div class="wiersz">
            <div class="kolumna">
                <h3>Wersje Moje</h3>
                <a href="3_1.html">Zadanie 3.1</a>
                <a href="3_2.html">Zadanie 3.2</a>
                <a href="3_3.html">Zadanie 3.3</a>
            </div>
            
            <div class="kolumna">
                <h3>Wersje AI</h3>
                <a href="3_1_ai.html">Zadanie 3.1</a>
                <a href="3_2_ai.html">Zadanie 3.2</a>
                <a href="3_3_ai.html">Zadanie 3.3</a>
            </div>
        </div>
    </div>

</body>
</html>
