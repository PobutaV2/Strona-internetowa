<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <title>Zadanie z formularzem rejestracyjnym</title>
    <style>
    
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: Georgia, serif;
        line-height: 1.5;
        padding: 50px;
        color: white;
        background-color: rgb(45,45,45);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        margin-bottom: 45px;
        text-align: center;
        font-size: 2.5rem;
      }

      form {
        background-color: rgb(65, 65, 65);
        border: 2px solid black;
        border-radius: 10px;
        padding: 25px;
		width: 100%;
        max-width: 500px;
      }

      p {
        margin-bottom: 20px;
      }

      label {
        font-weight: bold;
        display: inline-block;
        margin-bottom: 4px;
        color: #ddd;
      }

      input[type="text"],
      input[type="date"],
      input[type="tel"],
      input[type="email"],
      input[type="password"],
      select,
      textarea {
        width: 100%;
        padding: 10px;
        background-color: rgb(45, 45, 45);
        border: 2px solid black;
        border-radius: 6px;
        color: #ddd;
        font-family: Arial, sans-serif;
        font-size: 1rem;
        transition: border-color 0.2s;
      }


      textarea {
        resize: none;
      }

      .radio-sekcja {
        background-color: rgb(55, 55, 55);
        padding: 15px;
        border-radius: 6px;
        border: 1px solid black;
      }

      input[type="radio"] {
        margin-right: 6px;
        margin-bottom: 10px;
        cursor: pointer;
      }

      input[type="radio"] + label {
        font-weight: normal;
        margin-bottom: 0;
        cursor: pointer;
      }

      input[type="submit"],
      input[type="reset"] {
        width: 100%;
        padding: 12px;
        font-family: Georgia, serif;
        font-size: 1.1rem;
        font-weight: bold;
        border: 2px solid black;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
      }

      input[type="submit"] {
        background-color: #4da6ff;
        color: black;
      }

      input[type="reset"] {
        background-color: rgb(45, 45, 45);
        color: white;
      }

    </style>
  </head>
  <body>

    <h1>Rejestracja</h1>

    <form action="#" method="POST">
      <p>
        <label for="imie">Imię:</label>
        <input type="text" id="imie" name="imie" required>
      </p>
      <p>
        <label for="nazwisko">Nazwisko:</label>
        <input type="text" id="nazwisko" name="nazwisko" required>
      </p>
      <p>
        <label for="miasto">Miasto:</label>
        <input type="text" id="miasto" name="miasto" required>
      </p>
      <p>
        <label for="ulica">Ulica:</label>
        <input type="text" id="ulica" name="ulica" required>
      </p>
      <p>
        <label for="wojewodztwo">Województwo:</label>
        <select id="wojewodztwo" name="wojewodztwo" required>
          <option value="">Wybierz Województwo</option>
          <option value="dolnoslaskie">Dolnośląskie</option>
          <option value="kujawsko-pomorskie">Kujawsko-Pomorskie</option>
          <option value="lubelskie">Lubelskie</option>
          <option value="lubuskie">Lubuskie</option>
          <option value="lodzkie">Łódzkie</option>
          <option value="malopolskie">Małopolskie</option>
          <option value="mazowieckie">Mazowieckie</option>
          <option value="opolskie">Opolskie</option>
          <option value="podkarpackie">Podkarpackie</option>
          <option value="podlaskie">Podlaskie</option>
          <option value="pomorskie">Pomorskie</option>
          <option value="slaskie">Śląskie</option>
          <option value="swietokrzyskie">Świętokrzyskie</option>
          <option value="warminsko-mazurskie">Warmińsko-mazurskie</option>
          <option value="wielkopolskie">Wielkopolskie</option>
          <option value="zachodniopomorskie">Zachodniopomorskie</option>
        </select>
      </p>
      <p>
        <label for="data_urodzenia">Data urodzenia:</label>
        <input type="date" id="data_urodzenia" name="data_urodzenia" required>
      </p>
      <p>
        <label for="telefon">Numer telefonu:</label>
        <input type="tel" id="telefon" name="telefon" required>
      </p>
      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </p>
      <p>
        <label for="haslo">Hasło:</label>
        <input type="password" id="haslo" name="haslo" required>
      </p>
      
      <div class="p radio-sekcja">
        <label>Prawo jazdy:</label><br>
        
        <input type="radio" id="prawo_jazdy_tak" name="prawo_jazdy">
        <label for="prawo_jazdy_tak">Posiadam</label><br>

        <input type="radio" id="prawo_jazdy_nie" name="prawo_jazdy" checked>
        <label for="prawo_jazdy_nie">Nie posiadam</label>
      </div>
      
      <p style="margin-top: 20px;">
        <label for="uwagi">Dodatkowe uwagi:</label>
        <textarea id="uwagi" name="uwagi" rows="4" maxlength="500"></textarea>
      </p>
      <p>
        <input type="submit" value="Wyślij formularz">
        <input type="reset" value="Wyczyść odpowiedzi">
      </p>
    </form>

  </body>
</html>
