<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Galeria Zdjęć</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Georgia, serif;
            line-height: 1.5;
            padding: 50px;
            color: white;
            background-color: rgb(45,45,45);
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }

        .galeria-kontener {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        .foto-kafelek {
            width: 30%;
            flex: none;  
            background-color: rgb(65, 65, 65);
            border: 2px solid black;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .foto-kafelek img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 12px;
            display: block;
        }

        .foto-kafelek p {
            font-size: 1.1rem;
            color: ;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Galeria zdjęć</h1>
    <div class="galeria-kontener">
        <div class="foto-kafelek">
            <img src="pies1.jpg" alt="pies 1">
            <p>Pies 1</p>
        </div>
        <div class="foto-kafelek">
            <img src="pies2.jpg" alt="pies 2">
            <p>Pies 2</p>
        </div>
        <div class="foto-kafelek">
            <img src="pies3.jpg" alt="pies 3">
            <p>Pies 3</p>
        </div>
        <div class="foto-kafelek">
            <img src="pies4.jpg" alt="pies 4">
            <p>Pies 4</p>
        </div>
        <div class="foto-kafelek">
            <img src="pies5.jpg" alt="pies 5">
            <p>Pies 5</p>
        </div>
        <div class="foto-kafelek">
            <img src="pies6.jpg" alt="pies 6">
            <p>Pies 6</p>
        </div>
        <div class="foto-kafelek">
            <img src="pies7.jpg" alt="pies 7">
            <p>Pies 7</p>
        </div>
        <div class="foto-kafelek">
            <img src="pies8.jpg" alt="pies 8">
            <p>Pies 8</p>
        </div>
      <div class="foto-kafelek">
            <img src="pies9.jpg" alt="pies 9">
            <p>Pies 9</p>
        </div>

    </div>

</body>
</html>
